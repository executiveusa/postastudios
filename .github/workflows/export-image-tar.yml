name: Export Docker image tar

# One-off helper for deploys to hosts that build offline: builds the
# production image (linux/amd64 only) and uploads it as a private
# Actions artifact in docker tar format.

on:
  workflow_dispatch:

env:
  IMAGE_TAR: postastudios-amd64.tar

jobs:
  export:
    name: Build amd64 and export tar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and export docker tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64
          build-args: |
            VITE_REVERB_APP_KEY=postastudios-reverb-key
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_TAR }}

      - name: Upload image tar artifact
        uses: actions/upload-artifact@v7
        with:
          name: postastudios-image-amd64
          path: /tmp/${{ env.IMAGE_TAR }}
          retention-days: 7
          compression-level: 0
